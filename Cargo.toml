[package]
name = "hl-orderbook"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hl-orderbook"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HTTP server for Flutter API
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client for Hyperliquid Info endpoint
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Shared state
dashmap = "6"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config / env
dotenvy = "0.15"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
tokio-stream = "0.1"
